[project]
name = "capi"
version = "0.1.0"
description = "Planning poker — estimation de backlog (projet CAPI)"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
capi = "capi.ui.console:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
