name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs: 
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -e . pytest

      - name: Lancer les tests
        run: python -m pytest

      - name: Générer la documentation
        run: |
          python -m pip install pdoc
          python -m pdoc capi -o site

      - name: Archiver la documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site
